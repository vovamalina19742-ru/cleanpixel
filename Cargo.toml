[package]
name = "cleanpixel"
version = "0.1.0"
edition = "2021"
authors = ["Vladimir <vovamalina19742-ru>"]
description = "Ultra-fast lossless forensic metadata and GUID stripper for JPEG and PNG"
license = "MIT"
repository = "https://github.com/vovamalina19742-ru/cleanpixel"

[lib]
name = "cleanpixel"
path = "src/lib.rs"

[[bin]]
name = "cleanpixel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
